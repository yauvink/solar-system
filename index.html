<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#02040a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Solar System</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="space-loader" class="space-loader" role="status" aria-live="polite" aria-label="Preparing the scene">
      <div class="space-loader-inner">
        <div class="space-loader-stars" aria-hidden="true"></div>
        <div class="space-loader-stage" aria-hidden="true">
          <div class="space-loader-halo"></div>
          <div class="space-loader-planet"></div>
          <svg class="space-loader-ring" viewBox="0 0 184 112" aria-hidden="true">
            <ellipse cx="92" cy="56" rx="86" ry="50" />
          </svg>
          <div class="space-loader-moon-path">
            <div class="space-loader-moon"></div>
          </div>
        </div>
        <p class="space-loader-copy" id="space-loader-copy">Preparing the scene</p>
        <p class="space-loader-percent" id="space-loader-percent">0%</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
